- name: ensure sudo package is installed - systemd
  when: >
    ansible_distribution_major_version == "9"
    or ansible_distribution_major_version == "8"
    or ansible_distribution_major_version == "7"
  ansible.builtin.dnf:
    name: sudo
    state: present

- name: ensure sudo package is installed - yum
  when: >
    ansible_distribution_major_version == "6"
  ansible.builtin.yum:
    name: sudo
    state: present
